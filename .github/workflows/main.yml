name: Unity 2D Platformer CI/CD

on:
  push:
    branches: ["main", "master"]

jobs:
  # ЗАДАЧА 1: Проверка структуры проекта
  sanity_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check Unity Directories
        run: |
          if [ -d "ProjectSettings" ]; then echo "ProjectSettings найден."; else echo "Ошибка!" && exit 1; fi
          if [ -d "Packages" ]; then echo "Packages найден."; else echo "Ошибка!" && exit 1; fi

  # ЗАДАЧА 2: Запуск тестов (из ЛР №4)
  run_tests:
    needs: sanity_check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Packages/packages-lock.json', 'Assets/**/*.asmdef') }}

      - name: Install GameCI CLI
        run: |
          curl -sL -o game-ci.tar.gz https://github.com/game-ci/cli/releases/download/v0.1.72/game-ci-linux-x64.tar.gz
          tar xzf game-ci.tar.gz ./game-ci
          echo "$PWD" >> $GITHUB_PATH

      - name: Run Unity Tests
        run: |
          game-ci test --docker --dockerShmSize=1025m \
          --engine=unity --testPlatforms='playmode;editmode;COMBINE_RESULTS' \
          --engineVersion=6000.3.11f1 --coverageEnabled=false \
          --artifactsPath=artifacts --dockerIsolationMode=default \
          --containerRegistryRepository=unityci/editor \
          --containerRegistryImageVersion=3
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: artifacts/

  # НОВЫЙ ЭТАП (ЛР №5): Настоящая компиляция игры в облаке
  build_game:
    needs: run_tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Build-${{ hashFiles('Packages/packages-lock.json', 'Assets/**/*.asmdef') }}

      - name: Build WebGL Player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          buildMethod: BuildManager.BuildWebGL
          unityVersion: 6000.3.11f1

      - name: Upload WebGL Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WebGL-Build
          path: Builds/WebGL

  # ЗАДАЧА 3: Зеркалирование (из ЛР №2)
  mirror_repo:
    needs: run_tests
    if: github.repository == 'Likushh/2d_platformer' # Замените, если репозиторий называется иначе
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Push to Backup Repository
        env:
          BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          git push --force https://x-access-token:${{ secrets.BACKUP_TOKEN }}@github.com/Likushh/2d_platformer_backup.git master

  # ОБНОВЛЕННЫЙ ЭТАП (ЛР №5): Сборка Docker с НАСТОЯЩЕЙ игрой
  build_docker_image:
    needs: build_game # Ждем реального билда!
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download WebGL Artifact
        uses: actions/download-artifact@v4
        with:
          name: WebGL-Build
          path: Builds/WebGL

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Compressed Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/likushh/platformer-game:latest
            ghcr.io/likushh/platformer-game:${{ github.sha }}

  # НОВЫЙ ЭТАП (ЛР №5): Деплой на GitHub Pages
  deploy_to_pages:
    needs: build_game
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download WebGL Artifact
        uses: actions/download-artifact@v4
        with:
          name: WebGL-Build
          path: Builds/WebGL

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: Builds/WebGL
          branch: gh-pages

  # НОВЫЙ ЭТАП (ЛР №6): Telegram-оповещения
  notify:
    needs:
      [sanity_check, run_tests, build_game, build_docker_image, deploy_to_pages]
    if: always() # Выполнится при любом исходе
    runs-on: ubuntu-latest
    steps:
      - name: Determine pipeline status
        id: status
        run: |
          if [ "${{ needs.sanity_check.result }}" != "success" ]; then
            echo "stage=sanity_check" >> $GITHUB_OUTPUT
          elif [ "${{ needs.run_tests.result }}" != "success" ]; then
            echo "stage=run_tests" >> $GITHUB_OUTPUT
          elif [ "${{ needs.build_game.result }}" != "success" ]; then
            echo "stage=build_game" >> $GITHUB_OUTPUT
          elif [ "${{ needs.build_docker_image.result }}" != "success" ]; then
            echo "stage=build_docker_image" >> $GITHUB_OUTPUT
          elif [ "${{ needs.deploy_to_pages.result }}" != "success" ]; then
            echo "stage=deploy_to_pages" >> $GITHUB_OUTPUT
          else
            echo "stage=none" >> $GITHUB_OUTPUT
          fi

      - name: Send Telegram notification
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          STAGE: ${{ steps.status.outputs.stage }}
          SITE_URL: "https://likushh.github.io/ARPO1/"
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          AUTHOR: ${{ github.event.head_commit.author.name }}
        run: |
          if [ "$STAGE" = "none" ]; then
            TEXT="✅ Сборка ARPO1 завершена успешно!\nАвтор коммита: $AUTHOR\nИгра доступна: $SITE_URL\nЛог прогона: $RUN_URL"
          else
            TEXT="❌ Сборка ARPO1 упала на задаче $STAGE.\nАвтор коммита: $AUTHOR\nЛог прогона: $RUN_URL"
          fi

          curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
          -H "Content-Type: application/json" \
          -d "{\"chat_id\":\"$CHAT_ID\",\"text\":\"$TEXT\"}"
